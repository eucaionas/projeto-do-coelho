{% extends 'loja/base.html' %}
{% block content %}
<div class="topo"><h1>Categorias</h1><a class="btn" href="{% url 'categoria_criar' %}">+ Nova categoria</a></div>
<table><tr><th>Nome</th><th>Produtos</th><th></th></tr>
{% for c in categorias %}<tr><td>{{ c.nome }}</td><td>{{ c.produtos.count }}</td>
<td><a class="btn alt" href="{% url 'categoria_editar' c.pk %}">Editar</a> <a class="btn alt" href="{% url 'categoria_excluir' c.pk %}">Excluir</a></td></tr>
{% empty %}<tr><td colspan="3">Nenhuma categoria cadastrada. Cadastre uma antes de criar produtos.</td></tr>{% endfor %}</table>
{% endblock %}
